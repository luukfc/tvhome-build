name: Build CleanYourTV launcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CleanYourTV source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          path: src
          ref: v3.2.0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build launcher APK with Xiaomi allowlist identity
        run: |
          cd src/launcher
          chmod +x gradlew
          ./gradlew assembleRelease -PlauncherApplicationId=com.ts.launcher --no-daemon
      - name: Sign APK with fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/launcher-signing.p12"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/launcher-signing.p12" --ks-type PKCS12 --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" src/launcher/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs src/launcher/app/build/outputs/apk/release/app-release.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher-ts
          path: src/launcher/app/build/outputs/apk/release/app-release.apk
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "launcher-ts-3.2" src/launcher/app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --title "TV Home launcher 3.2 (com.ts.launcher)" --notes "CleanYourTV launcher 3.2 built with applicationId com.ts.launcher for the Xiaomi CN TV Home allowlist." || gh release upload "launcher-ts-3.2" src/launcher/app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
