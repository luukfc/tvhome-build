name: Build CleanYourTV launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - launcher-version.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository (version file)
        uses: actions/checkout@v4
        with:
          path: meta
      - name: Resolve launcher version
        id: ver
        run: |
          VER=$(tr -d '[:space:]' < meta/launcher-version.txt)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "ref=v${VER}.0" >> "$GITHUB_OUTPUT"
      - name: Check out CleanYourTV source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          path: src
          ref: ${{ steps.ver.outputs.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build launcher APK with Xiaomi allowlist identity
        run: |
          cd src/launcher
          chmod +x gradlew
          ./gradlew assembleRelease -PlauncherApplicationId=com.ts.launcher --no-daemon
      - name: Sign APK with fixed signing key
        env:
          KEYSTORE_B64_1: ${{ secrets.KEYSTORE_B64_1 }}
          KEYSTORE_B64_2: ${{ secrets.KEYSTORE_B64_2 }}
          KEYSTORE_B64_3: ${{ secrets.KEYSTORE_B64_3 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "part lengths: ${#KEYSTORE_B64_1} ${#KEYSTORE_B64_2} ${#KEYSTORE_B64_3}"
          printf '%s%s%s' "$KEYSTORE_B64_1" "$KEYSTORE_B64_2" "$KEYSTORE_B64_3" | base64 -d > "$RUNNER_TEMP/launcher-signing.p12"
          echo "keystore sha256: $(sha256sum "$RUNNER_TEMP/launcher-signing.p12" | cut -d' ' -f1)"
          test "$(sha256sum "$RUNNER_TEMP/launcher-signing.p12" | cut -d' ' -f1)" = "df322eb36a0271f596a2b921d22e4baf04b0da3751ad3d186aa34c69a64e46d8"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/launcher-signing.p12" --ks-type PKCS12 --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" src/launcher/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs src/launcher/app/build/outputs/apk/release/app-release.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher-ts
          path: src/launcher/app/build/outputs/apk/release/app-release.apk
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          gh release create "launcher-ts-$VER" src/launcher/app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --title "TV Home launcher $VER (com.ts.launcher)" --notes "CleanYourTV launcher $VER built with applicationId com.ts.launcher for the Xiaomi CN TV Home allowlist." || gh release upload "launcher-ts-$VER" src/launcher/app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
